name: leak-check

# Enforces HARD REQUIREMENT 1: no real-world tokens in the library.
# Fails the check if scripts/leak-check.mjs finds any project/product name,
# domain, user path, handle, name, email, or git-SHA-like hex run.

# Pre-release only (0.31.66), like agent-companion-tests: a push to release/** or
# main (the library also lands direct commits on main), a pull request into
# main, and by hand. Not every branch push: the pre-push hook already runs the
# leak and private-names scan on the machine before anything is pushed (a
# branch pushed to this public repo is public from that moment, so a post-push
# check cannot undo a leak), and this job is the backstop for what reaches a
# release or main. It takes about 40 s.
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Both steps below call scripts/ci-local.mjs -- the same entry point a
      # contributor runs locally (by hand, or via .githooks/pre-push) -- so
      # this workflow and a local run can never drift apart. See
      # CONTRIBUTING.md for the local-gate setup.
      - name: Run leak-check tests
        run: node scripts/ci-local.mjs --suite scripts-tests

      # No dev root exists on the runner, so derived-name checks print a note
      # and find nothing; the static token, SHA and private-path checks run.
      - name: Run leak-check
        run: node scripts/ci-local.mjs --suite leak-check

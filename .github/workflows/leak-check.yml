name: leak-check

# Enforces HARD REQUIREMENT 1: no real-world tokens in the library.
# Fails the check if scripts/leak-check.mjs finds any project/product name,
# domain, user path, handle, name, email, or git-SHA-like hex run.

on:
  push:
    branches-ignore:
      - 'wip/**'
      - 'backup/**'
  pull_request:

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Both steps below call scripts/ci-local.mjs -- the same entry point a
      # contributor runs locally (by hand, or via .githooks/pre-push) -- so
      # this workflow and a local run can never drift apart. See
      # CONTRIBUTING.md for the local-gate setup.
      - name: Run leak-check tests
        run: node scripts/ci-local.mjs --suite scripts-tests

      # No dev root exists on the runner, so derived-name checks print a note
      # and find nothing; the static token, SHA and private-path checks run.
      - name: Run leak-check
        run: node scripts/ci-local.mjs --suite leak-check

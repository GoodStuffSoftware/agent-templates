name: agent-companion-tests

# Runs the agent-companion plugin's zero-dependency test suite (node:test).
# Every test isolates itself under a fresh temp dir via
# AGENT_COMPANION_HOME_OVERRIDE / AGENT_COMPANION_STATE_DIR, so this never
# touches anything outside the checkout.
#
# Since 0.31.30 this workflow is THE test gate: the pre-push hook only scans
# for leaks and private names, and a contributor runs just the targeted tests
# for the files they touch.
#
# Pre-release only (0.31.66): it runs on a push to release/**, on a pull request
# into main, and by hand, never on every branch push. Linux only: the full suite
# runs on the operator's Windows machine before every release (CONTRIBUTING.md,
# "Release gate"), so a GitHub Windows job only repeated that, while Linux is
# the platform that cannot be run locally. The suite is split into SHARDS
# (scripts/ci-local.mjs, CI_LOCAL_SHARD) that run as parallel jobs, so the
# slowest job is a few minutes, not the 7 of one job over all 302 files.

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A release push is seen twice (the push, and the open PR's synchronize): the
# newer run of the same branch replaces the older, so each commit tests once.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard going red must not hide the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_LOCAL_SHARD: ${{ matrix.shard }}/3
      # The runner is this job's alone, so the desktop-sharing machinery in
      # ci-local (the shared budget, its load guard, slices of 6 files per
      # worker with a barrier after each) only costs time here. Off, with
      # every test file in one run at 4 at a time (the runner has 4 vCPU).
      CI_LOCAL_LOCK: '0'
      CI_LOCAL_SLICE: '0'
      CI_LOCAL_TEST_CONCURRENCY: '4'
      CI_LOCAL_HEAVY_MAX: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A task-pack fixture (bench/task-packs/examples/leak-check-gitignore-fix)
          # pins a historical commit by SHA and reads it with `git show`. A
          # shallow (depth-1) clone doesn't have that object, so
          # `git show <ref>:<path>` fails with "invalid object name". Full
          # history avoids that without pinning to a specific depth.
          #
          # scripts/ci-local.mjs's --ci-parity mode reads THIS number back
          # out of this file at run time, so a future change here doesn't
          # need a matching edit anywhere else to stay honest.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Calls the same entry point a contributor can run by hand -- see
      # CONTRIBUTING.md. ci-local.mjs expands the
      # plugins/agent-companion/tests/*.test.mjs glob itself, so this stays
      # independent of any platform's own glob resolution inside the test
      # runner.
      - name: Run agent-companion test suite (shard ${{ matrix.shard }}/3)
        run: node scripts/ci-local.mjs --suite agent-companion-tests
